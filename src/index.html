<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Non-Steam Uploader</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></symbol>
        <symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 19h10.5a4.5 4.5 0 0 0 .5-8.97A6.5 6.5 0 0 0 5.6 9.2 5 5 0 0 0 7 19z" /></symbol>
        <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4" /><path d="M11 12l9-9M17 6l3 3M14.5 8.5l2.5 2.5" /></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /></symbol>
        <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.6-4.5L4 8M4 4v4h4M4 13a8 8 0 0 0 14.6 4.5L20 16M20 20v-4h-4" /></symbol>
        <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 0 1 0 11H11" /></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3" /></symbol>
        <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" /></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="2" /><path d="M21 16l-5-5-9 9" /></symbol>
        <symbol id="i-vr" viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-4l-2-3h-2l-2 3H5a2 2 0 0 1-2-2z" /></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" /></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></symbol>
        <symbol id="i-chevron" viewBox="0 0 24 24"><path d="M6 15l6-6 6 6" /></symbol>
        <symbol id="i-monitor" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" /><path d="M8 20h8M12 16v4" /></symbol>
        <symbol id="i-gamepad" viewBox="0 0 24 24"><path d="M6 10h4M8 8v4M15 11h.01M18 10h.01M4 6h16a2 2 0 0 1 2 2v7a3 3 0 0 1-5.1 2.1L15 15H9l-1.9 2.1A3 3 0 0 1 2 15V8a2 2 0 0 1 2-2z" /></symbol>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9zM14 3v6h6" /></symbol>
        <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" /><path d="M12 7.5v5.5M12 16.5h.01" /></symbol>
      </defs>
    </svg>

    <div class="app">
      <header class="topbar">
        <div class="brand">
          <img src="../icon.png" alt="" draggable="false" />
          <div>
            <h1>Non-Steam Uploader</h1>
            <p id="gameCount">Loading library...</p>
          </div>
        </div>
        <nav class="top-actions">
          <button id="cloudBtn" type="button" class="btn ghost"><svg class="ic"><use href="#i-cloud" /></svg><span class="lbl">Cloud Saves</span></button>
          <button id="apiKeyBtn" type="button" class="btn ghost">
            <svg class="ic"><use href="#i-key" /></svg><span class="lbl">SteamGridDB</span><span id="apiKeyStatus" class="status-dot" aria-live="polite"></span>
          </button>
          <button id="steamLocationBtn" type="button" class="btn ghost icon-only" aria-label="Steam location"><svg class="ic"><use href="#i-folder" /></svg></button>
          <button id="restartSteamBtn" type="button" class="btn primary"><svg class="ic"><use href="#i-refresh" /></svg>Restart Steam</button>
        </nav>
      </header>

      <section id="dropZone" class="drop-zone" aria-label="Add games" tabindex="0">
        <div class="drop-idle">
          <span class="drop-icon"><svg class="ic"><use href="#i-plus" /></svg></span>
          <div>
            <strong>Add games</strong>
            <span>Drop <code>.exe</code> or <code>.lnk</code> files anywhere, or click to browse</span>
          </div>
        </div>
        <div id="progressWrap" class="drop-busy" aria-live="polite">
          <div class="progress-meta">
            <span id="progressLabel">Preparing...</span>
            <span id="progressPct">0%</span>
          </div>
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
        </div>
      </section>

      <section class="library" aria-label="Game library">
        <div class="toolbar">
          <h2>Library</h2>
          <div class="toolbar-controls">
            <label class="select" title="Card size">
              <select id="sizeSelect" aria-label="Card size">
                <option value="small">Small</option>
                <option value="medium" selected>Medium</option>
                <option value="large">Large</option>
              </select>
            </label>
            <label class="select" title="Sort">
              <select id="sortSelect" aria-label="Sort games">
                <option value="added_desc">Recently added</option>
                <option value="added_asc">Oldest added</option>
                <option value="name_asc">Name A-Z</option>
                <option value="name_desc">Name Z-A</option>
                <option value="vr_first">VR first</option>
              </select>
            </label>
            <span class="toolbar-sep"></span>
            <button id="undoBtn" type="button" class="btn ghost icon-only" aria-label="Undo" disabled><svg class="ic"><use href="#i-undo" /></svg></button>
            <button id="removeAllBtn" type="button" class="btn ghost danger icon-only" aria-label="Remove all" title="Remove all"><svg class="ic"><use href="#i-trash" /></svg></button>
          </div>
        </div>
        <div id="gamesGrid" class="games-grid"></div>
      </section>

      <footer class="activity">
        <div class="activity-panel">
          <div>
            <pre id="statusLog">Ready.</pre>
          </div>
        </div>
        <button id="activityBtn" type="button" class="activity-bar" aria-expanded="false">
          <span class="activity-label">Activity</span>
          <span id="activityLast" class="activity-last">Ready.</span>
          <svg class="ic chevron"><use href="#i-chevron" /></svg>
        </button>
      </footer>
    </div>

    <div id="dragOverlay" class="drag-overlay" aria-hidden="true">
      <div class="drag-card">
        <span class="drop-icon"><svg class="ic"><use href="#i-plus" /></svg></span>
        <strong>Drop to add to Steam</strong>
        <span>.exe and .lnk files</span>
      </div>
    </div>
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="./renderer.js"></script>
  </body>
</html>
